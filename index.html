<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>餐盤日記</title>
<meta name="description" content="記錄每餐熱量、三大營養素與喝水量">
<meta name="theme-color" content="#f3f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="餐盤日記">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: phone-first app shell — date bar on top, scrolling view in the middle, tab bar + add button pinned to the bottom */
:root {
  --bg: #f3f5f0;
  --surface: #ffffff;
  --fg: #1b231e;
  --muted: #66716a;
  --line: #dde3dc;
  --accent: #2f7a4d;
  --accent-soft: #e2efe6;
  --on-accent: #ffffff;
  --over: #c8462c;
  --protein: #3d6fb6;
  --carbs: #d39a1c;
  --fat: #c25b8a;
  --water: #3a9bb8;
  --scrim: rgba(20, 28, 24, .35);
  --font-num: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 16px;
  --tabbar: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121614; --surface: #1b211e; --fg: #e8eee9; --muted: #98a39c; --line: #2c3530;
  --accent: #6cc28f; --accent-soft: #20352a; --on-accent: #0f1a14; --over: #ef7a5f;
  --protein: #7ea6e6; --carbs: #e8bb54; --fat: #e488b2; --water: #6cc6e0; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.topbar .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 12px; }
.topbar h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.datenav { display: flex; align-items: center; gap: 2px; }
.datenav button { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 99px; font-size: 22px; line-height: 1; color: var(--accent); }
.datenav button:disabled { color: var(--line); }
.datenav .label { min-width: 84px; text-align: center; font-weight: 600; font-size: 15px; line-height: 1.15; }
.datenav .label small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }

main { max-width: 640px; margin: 0 auto; padding-top: 4px; padding-bottom: calc(var(--tabbar) + 88px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.view { display: grid; gap: 16px; }
h2 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 4px 0 0; font-weight: 500; }

/* summary */
.summary { background: var(--surface); border-radius: var(--radius); padding: 18px; display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-size: 32px; font-weight: 700; line-height: 1; }
.ring .cap { font-size: 11px; color: var(--muted); margin-top: 4px; }
.macros { display: grid; gap: 10px; min-width: 0; }
.macro .row { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
.bar { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .3s; }
@media (max-width: 360px) { .summary { grid-template-columns: 1fr; justify-items: center; } .macros { width: 100%; } }

.water { background: var(--surface); border-radius: var(--radius); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.water .cups { display: flex; gap: 6px; }
.cup { width: 24px; height: 28px; border: 1.5px solid var(--water); border-radius: 3px 3px 8px 8px; background: transparent; padding: 0; }
.cup.on { background: var(--water); }
.water .lbl { font-size: 13px; color: var(--muted); }

/* meals */
.meal { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.meal-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-weight: 600; }
.meal-head .k { color: var(--muted); font-size: 13px; font-weight: 400; }
.meal-head button { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 12px; font-size: 13px; font-weight: 500; }
.meal ul { list-style: none; margin: 0; padding: 0; }
.meal li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 9px 8px 9px 16px; border-top: 1px solid var(--line); }
.meal li .name { min-width: 0; overflow-wrap: anywhere; }
.meal li .sub { font-size: 12px; color: var(--muted); }
.meal li button { border: 0; background: transparent; color: var(--muted); font-size: 20px; width: 36px; height: 36px; border-radius: 8px; }

/* trends */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
.card svg { width: 100%; height: auto; display: block; }
.card svg text { fill: var(--muted); font-size: 17px; font-family: var(--font-body); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--radius); padding: 12px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--muted); }
.toplist { list-style: none; margin: 0; padding: 0; }
.toplist li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.toplist li:first-child { border-top: 0; }
.toplist .cnt { color: var(--muted); font-size: 13px; }

/* settings */
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; font-size: 16px; width: 100%; min-width: 0; }
.grid4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: transparent; color: var(--over); border: 1px solid var(--line); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.empty { color: var(--muted); font-size: 13px; padding: 4px 16px 12px; }

/* bottom bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .inner { max-width: 640px; margin: 0 auto; height: var(--tabbar); display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { border: 0; background: transparent; color: var(--muted); font-size: 11px; display: grid; justify-items: center; align-content: center; gap: 2px; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.fab { position: fixed; z-index: 7; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); font-size: 32px; line-height: 1; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }

/* add sheet */
dialog.sheet { border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 92dvh; background: var(--surface); color: var(--fg); border-radius: 20px 20px 0 0; }
@media (min-width: 680px) { dialog.sheet { max-width: 640px; margin: auto; border-radius: 20px; } }
dialog.sheet::backdrop { background: var(--scrim); }
.sheet form { display: grid; gap: 12px; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto; }
.sheet .head { display: flex; justify-content: space-between; align-items: center; }
.sheet .head h3 { margin: 0; font-size: 17px; }
.sheet .head button { border: 0; background: transparent; color: var(--accent); font-size: 15px; padding: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 13px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.search { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 16px; width: 100%; }
.sugg { list-style: none; margin: 0; padding: 0; max-height: 34dvh; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
.sugg li { display: grid; grid-template-columns: 1fr auto; align-items: center; border-top: 1px solid var(--line); }
.sugg li:first-child { border-top: 0; }
.sugg li.sec { display: block; padding: 6px 12px; font-size: 11px; color: var(--muted); letter-spacing: .06em; background: var(--bg); }
.sugg .pick { border: 0; background: transparent; text-align: left; padding: 9px 12px; min-width: 0; }
.sugg .pick small { display: block; color: var(--muted); font-size: 12px; }
.sugg .star { border: 0; background: transparent; font-size: 20px; width: 44px; height: 44px; color: var(--muted); }
.sugg .star[aria-pressed="true"] { color: var(--carbs); }
.serv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 90px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="topbar gutter">
  <div class="inner">
    <h1 id="viewTitle">今天</h1>
    <div class="datenav" id="datenav">
      <button id="prev" aria-label="前一天">‹</button>
      <div class="label" id="dateLabel"></div>
      <button id="next" aria-label="後一天">›</button>
    </div>
  </div>
</div>

<main class="gutter">
  <!-- 今天 -->
  <div class="view" id="v-today">
    <div class="summary">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="11"></circle>
          <circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="0 999"></circle>
        </svg>
        <div class="center"><div class="big num" id="kcalLeft">0</div><div class="cap" id="kcalCap">大卡 剩餘</div></div>
      </div>
      <div class="macros">
        <div class="macro"><div class="row"><span>蛋白質</span><span class="num" id="pTxt"></span></div><div class="bar"><i id="pBar" style="background:var(--protein)"></i></div></div>
        <div class="macro"><div class="row"><span>碳水</span><span class="num" id="cTxt"></span></div><div class="bar"><i id="cBar" style="background:var(--carbs)"></i></div></div>
        <div class="macro"><div class="row"><span>脂肪</span><span class="num" id="fTxt"></span></div><div class="bar"><i id="fBar" style="background:var(--fat)"></i></div></div>
      </div>
    </div>
    <div class="water"><span>喝水 <span class="lbl num" id="waterTxt"></span></span><span class="cups" id="cups"></span></div>
    <div id="meals" class="view"></div>
  </div>

  <!-- 趨勢 -->
  <div class="view" id="v-trend" hidden>
    <h2>最近 7 天熱量</h2>
    <div class="card" id="week"></div>
    <div class="stats">
      <div class="stat"><div class="v num" id="avgK"></div><div class="l">7 天平均 kcal</div></div>
      <div class="stat"><div class="v num" id="avgP"></div><div class="l">平均蛋白質 g</div></div>
      <div class="stat"><div class="v num" id="streak"></div><div class="l">連續記錄天數</div></div>
    </div>
    <h2>最常吃的食物</h2>
    <div class="card"><ul class="toplist" id="toplist"></ul></div>
  </div>

  <!-- 設定 -->
  <div class="view" id="v-settings" hidden>
    <h2>每日目標</h2>
    <div class="card grid4">
      <label class="field">熱量 kcal<input id="gKcal" type="number" inputmode="numeric" min="0"></label>
      <label class="field">蛋白質 g<input id="gP" type="number" inputmode="numeric" min="0"></label>
      <label class="field">碳水 g<input id="gC" type="number" inputmode="numeric" min="0"></label>
      <label class="field">脂肪 g<input id="gF" type="number" inputmode="numeric" min="0"></label>
    </div>
    <h2>備份</h2>
    <div class="card view">
      <p class="note">紀錄只存在這支手機上。換手機或清除 Safari 資料前，先匯出備份檔，之後再匯入就能還原。</p>
      <div class="btnrow">
        <button class="btn soft" id="exportBtn">匯出備份</button>
        <label class="btn soft" for="importFile" style="cursor:pointer">匯入備份</label>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="note num" id="statsNote"></p>
    </div>
    <h2>加到主畫面</h2>
    <div class="card"><p class="note">iPhone：用 Safari 打開，點下方「分享」→「加入主畫面」。Android：用 Chrome 打開，點右上「⋮」→「安裝應用程式」或「加到主畫面」。</p></div>
  </div>
</main>

<button class="fab" id="fab" aria-label="新增一筆">+</button>

<nav class="tabbar gutter" aria-label="主要頁面">
  <div class="inner">
    <button data-view="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle></svg>今天</button>
    <button data-view="trend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V12M10 19V7M15 19v-9M20 19V5"></path></svg>趨勢</button>
    <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>設定</button>
  </div>
</nav>

<dialog class="sheet" id="sheet">
  <form id="addForm" method="dialog" autocomplete="off">
    <div class="grab"></div>
    <div class="head"><h3>新增一筆</h3><button type="button" id="closeSheet">取消</button></div>
    <div class="chips" id="mealChips"></div>
    <input class="search" id="q" type="search" placeholder="搜尋食物，或直接輸入名稱" enterkeyhint="search">
    <ul class="sugg" id="sugg"></ul>
    <div class="serv">份量 <span class="chips" id="servChips"></span></div>
    <div class="grid4">
      <label class="field">熱量 kcal<input id="fKcal" type="number" inputmode="decimal" min="0" step="1" required></label>
      <label class="field">蛋白質 g<input id="fP" type="number" inputmode="decimal" min="0" step="0.1"></label>
      <label class="field">碳水 g<input id="fC" type="number" inputmode="decimal" min="0" step="0.1"></label>
      <label class="field">脂肪 g<input id="fF" type="number" inputmode="decimal" min="0" step="0.1"></label>
    </div>
    <button class="btn primary" type="submit" id="saveBtn">加入</button>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
const MEALS = ["早餐", "午餐", "晚餐", "點心"];
const WATER_GOAL = 8;
const DEFAULT_GOALS = { kcal: 1800, p: 100, c: 200, f: 60 };
const KEY = "plate-diary-v1";
const SERVINGS = [0.5, 1, 1.5, 2];

/* 常見台灣食物，數值為一般份量的估計值 */
const FOODS = [
  ["白飯 1 碗", 280, 5, 62, 0.5], ["糙米飯 1 碗", 260, 6, 55, 2], ["地瓜 1 條(中)", 130, 1.5, 30, 0.2],
  ["白吐司 1 片", 80, 2.5, 15, 1], ["全麥吐司 1 片", 75, 3.5, 13, 1], ["水煮蛋 1 顆", 72, 6.3, 0.4, 4.8],
  ["茶葉蛋 1 顆", 75, 7, 1, 5], ["荷包蛋 1 顆", 95, 6.3, 0.4, 7.5], ["無糖豆漿 400ml", 130, 13, 5, 7],
  ["鮮奶 290ml", 185, 9, 14, 10], ["無糖拿鐵 中杯", 150, 8, 12, 8], ["美式咖啡 中杯", 10, 0.5, 1, 0],
  ["珍珠奶茶 全糖 700ml", 650, 5, 110, 20], ["珍珠奶茶 半糖 700ml", 480, 5, 75, 20], ["無糖綠茶", 0, 0, 0, 0],
  ["可樂 330ml", 140, 0, 35, 0], ["蛋餅 原味", 250, 8, 28, 12], ["蘿蔔糕 2 片", 220, 3, 30, 10],
  ["燒餅油條", 500, 12, 55, 26], ["傳統飯糰", 500, 13, 80, 14], ["御飯糰 鮪魚", 210, 5, 35, 5],
  ["超商舒肥雞胸 1 包", 120, 24, 2, 2], ["雞胸肉 100g", 165, 31, 0, 3.6], ["鮭魚 100g", 200, 20, 0, 13],
  ["燙青菜 1 份", 60, 2, 5, 3.5], ["滷肉飯 小碗", 400, 11, 55, 15], ["雞腿便當", 850, 40, 100, 30],
  ["排骨便當", 900, 35, 105, 35], ["牛肉麵 1 碗", 650, 35, 75, 22], ["陽春麵 1 碗", 350, 11, 60, 7],
  ["乾麵 1 碗", 450, 12, 65, 15], ["水餃 10 顆", 500, 20, 55, 22], ["鍋貼 10 顆", 600, 20, 55, 33],
  ["鹹酥雞 1 份", 600, 30, 30, 40], ["臭豆腐 1 份", 450, 18, 25, 30], ["個人小火鍋", 900, 45, 80, 40],
  ["大麥克", 550, 25, 45, 30], ["中薯", 340, 4, 44, 16], ["香蕉 1 根", 105, 1.3, 27, 0.4],
  ["蘋果 1 顆", 95, 0.5, 25, 0.3], ["芭樂 1 顆", 80, 2.6, 17, 1], ["無糖希臘優格 1 盒", 100, 10, 5, 4],
  ["綜合堅果 30g", 180, 5, 6, 15], ["超商沙拉 含醬", 200, 5, 15, 13], ["乳清蛋白 1 匙", 120, 24, 3, 1.5],
].map(([name, kcal, p, c, f]) => ({ name, kcal, p, c, f }));

const $ = id => document.getElementById(id);
const r1 = n => Math.round(n * 10) / 10;

let state = load();
let current = todayKey();
let view = "today";
let selMeal = guessMeal();
let serving = 1;
let base = null;            // the food the form was filled from, before the serving multiplier

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
    return { days: raw.days || {}, goals: { ...DEFAULT_GOALS, ...(raw.goals || {}) }, favorites: raw.favorites || [] };
  } catch { return { days: {}, goals: { ...DEFAULT_GOALS }, favorites: [] }; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch { toast("手機空間不足，這次沒有存到"); }
}

function todayKey(d = new Date()) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function shift(key, n) { const d = new Date(key + "T12:00:00"); d.setDate(d.getDate() + n); return todayKey(d); }
function guessMeal() { const h = new Date().getHours(); return h < 10 ? "早餐" : h < 14 ? "午餐" : h < 17 ? "點心" : "晚餐"; }
function day(key) { return state.days[key] || { entries: [], water: 0 }; }
function totals(key) {
  return day(key).entries.reduce((t, e) => ({ kcal: t.kcal + (+e.kcal || 0), p: t.p + (+e.p || 0), c: t.c + (+e.c || 0), f: t.f + (+e.f || 0) }), { kcal: 0, p: 0, c: 0, f: 0 });
}
function commitDay(key, d) { state.days[key] = d; save(); render(); }

/* 用過的食物：每個名稱取最近一次的數值，並計算次數 */
function history() {
  const map = new Map();
  Object.keys(state.days).sort().forEach(k => day(k).entries.forEach(e => {
    const prev = map.get(e.name);
    map.set(e.name, { name: e.name, kcal: e.kcal, p: e.p, c: e.c, f: e.f, count: (prev?.count || 0) + 1 });
  }));
  return map;
}
function frequent() {
  const h = history();
  const fav = state.favorites.map(n => h.get(n) || FOODS.find(f => f.name === n)).filter(Boolean);
  const rest = [...h.values()].filter(f => f.count >= 2 && !state.favorites.includes(f.name)).sort((a, b) => b.count - a.count);
  return [...fav, ...rest].slice(0, 12);
}

/* ---------- render ---------- */
function render() {
  const wk = ["日", "一", "二", "三", "四", "五", "六"][new Date(current + "T12:00:00").getDay()];
  const rel = current === todayKey() ? "今天" : current === shift(todayKey(), -1) ? "昨天" : `星期${wk}`;
  $("dateLabel").innerHTML = `${+current.slice(5, 7)}/${+current.slice(8)}<small>${rel}</small>`;
  $("next").disabled = current >= todayKey();
  $("viewTitle").textContent = { today: rel, trend: "趨勢", settings: "設定" }[view];
  $("datenav").style.visibility = view === "settings" ? "hidden" : "";
  $("fab").hidden = view !== "today";
  for (const v of ["today", "trend", "settings"]) $("v-" + v).hidden = v !== view;
  document.querySelectorAll(".tabbar button").forEach(b => {
    if (b.dataset.view === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (view === "today") renderToday();
  if (view === "trend") renderTrend();
  if (view === "settings") renderSettings();
}

function renderToday() {
  const t = totals(current), d = day(current), g = state.goals;
  const left = Math.round(g.kcal - t.kcal), over = left < 0;
  $("kcalLeft").textContent = Math.abs(left);
  $("kcalLeft").style.color = over ? "var(--over)" : "";
  $("kcalCap").innerHTML = `${over ? "大卡 超出" : "大卡 剩餘"}<br>已吃 ${Math.round(t.kcal)}`;
  const C = 2 * Math.PI * 52, frac = Math.min(t.kcal / (g.kcal || 1), 1);
  $("ringArc").setAttribute("stroke-dasharray", `${frac * C} ${C}`);
  $("ringArc").setAttribute("stroke", over ? "var(--over)" : "var(--accent)");
  for (const k of ["p", "c", "f"]) {
    $(k + "Txt").textContent = `${r1(t[k])} / ${g[k]} g`;
    $(k + "Bar").style.width = Math.min(100, (t[k] / (g[k] || 1)) * 100) + "%";
  }

  $("cups").innerHTML = "";
  for (let i = 0; i < WATER_GOAL; i++) {
    const b = document.createElement("button");
    b.className = "cup" + (i < d.water ? " on" : "");
    b.setAttribute("aria-label", `喝了 ${i + 1} 杯`);
    b.onclick = () => commitDay(current, { ...d, water: d.water === i + 1 ? i : i + 1 });
    $("cups").appendChild(b);
  }
  $("waterTxt").textContent = `${d.water * 250} ml`;

  const box = $("meals"); box.innerHTML = "";
  for (const m of MEALS) {
    const list = d.entries.filter(e => e.meal === m);
    const kcal = list.reduce((s, e) => s + (+e.kcal || 0), 0);
    const card = document.createElement("div"); card.className = "meal";
    const head = document.createElement("div"); head.className = "meal-head";
    head.innerHTML = `<span>${m} <span class="k num">${Math.round(kcal)} kcal</span></span>`;
    const add = document.createElement("button"); add.textContent = "+ 新增";
    add.onclick = () => openSheet(m);
    head.appendChild(add); card.appendChild(head);
    const ul = document.createElement("ul");
    if (!list.length) { const p = document.createElement("div"); p.className = "empty"; p.textContent = "還沒有紀錄"; card.appendChild(p); }
    for (const e of list) {
      const li = document.createElement("li");
      const name = document.createElement("div"); name.className = "name"; name.textContent = e.name;
      const sub = document.createElement("div"); sub.className = "sub num";
      sub.textContent = `P ${r1(+e.p || 0)} · C ${r1(+e.c || 0)} · F ${r1(+e.f || 0)}`;
      name.appendChild(sub);
      const k = document.createElement("span"); k.className = "num"; k.textContent = Math.round(e.kcal);
      const del = document.createElement("button"); del.textContent = "×"; del.setAttribute("aria-label", `刪除 ${e.name}`);
      del.onclick = () => {
        const dd = day(current);
        commitDay(current, { ...dd, entries: dd.entries.filter(x => x.id !== e.id) });
        toast(`已刪除「${e.name}」`);
      };
      li.append(name, k, del); ul.appendChild(li);
    }
    card.appendChild(ul); box.appendChild(card);
  }
}

function renderTrend() {
  const g = state.goals, W = 560, H = 200, pad = 30, keys = [];
  for (let i = 6; i >= 0; i--) keys.push(shift(current, -i));
  const tots = keys.map(totals), vals = tots.map(t => t.kcal);
  const max = Math.max(g.kcal * 1.25, ...vals, 1);
  const bw = (W - pad * 2) / 7, y = v => H - pad - (v / max) * (H - pad * 2);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 7 天每日熱量">`;
  s += `<line x1="${pad}" x2="${W - pad}" y1="${y(g.kcal)}" y2="${y(g.kcal)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
  s += `<text x="${W - pad}" y="${y(g.kcal) - 5}" text-anchor="end">目標 ${g.kcal}</text>`;
  keys.forEach((k, i) => {
    const v = vals[i], x = pad + i * bw + bw * 0.22, w = bw * 0.56;
    const fill = v > g.kcal ? "var(--over)" : k === current ? "var(--accent)" : "var(--line)";
    if (v > 0) s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${H - pad - y(v)}" rx="5" fill="${fill}"/><text x="${x + w / 2}" y="${y(v) - 5}" text-anchor="middle">${Math.round(v)}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle"${k === current ? ' style="fill:var(--fg);font-weight:700"' : ""}>${+k.slice(5, 7)}/${+k.slice(8)}</text>`;
  });
  $("week").innerHTML = s + "</svg>";

  const logged = tots.filter(t => t.kcal > 0);
  $("avgK").textContent = logged.length ? Math.round(logged.reduce((a, t) => a + t.kcal, 0) / logged.length) : "–";
  $("avgP").textContent = logged.length ? Math.round(logged.reduce((a, t) => a + t.p, 0) / logged.length) : "–";
  let streak = 0, k = todayKey();
  if (!day(k).entries.length) k = shift(k, -1);
  while (day(k).entries.length) { streak++; k = shift(k, -1); }
  $("streak").textContent = streak;

  const top = [...history().values()].sort((a, b) => b.count - a.count).slice(0, 8);
  $("toplist").innerHTML = "";
  if (!top.length) $("toplist").innerHTML = `<li class="note">記錄幾天後，這裡會列出你最常吃的食物。</li>`;
  top.forEach(f => {
    const li = document.createElement("li");
    const n = document.createElement("span"); n.textContent = f.name;
    const c = document.createElement("span"); c.className = "cnt num"; c.textContent = `${f.count} 次 · ${Math.round(f.kcal)} kcal`;
    li.append(n, c); $("toplist").appendChild(li);
  });
}

function renderSettings() {
  for (const [k, id] of [["kcal", "gKcal"], ["p", "gP"], ["c", "gC"], ["f", "gF"]])
    if (document.activeElement !== $(id)) $(id).value = state.goals[k];
  const n = Object.values(state.days).reduce((a, d) => a + d.entries.length, 0);
  $("statsNote").textContent = `目前共 ${Object.keys(state.days).length} 天、${n} 筆紀錄。`;
}

/* ---------- add sheet ---------- */
function openSheet(meal) {
  selMeal = meal || guessMeal(); serving = 1; base = null;
  $("addForm").reset(); $("q").value = "";
  renderSheet();
  $("sheet").showModal();
}
function renderSheet() {
  $("mealChips").innerHTML = "";
  for (const m of MEALS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = m;
    b.setAttribute("aria-pressed", m === selMeal);
    b.onclick = () => { selMeal = m; renderSheet(); };
    $("mealChips").appendChild(b);
  }
  $("servChips").innerHTML = "";
  for (const s of SERVINGS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip num"; b.textContent = `${s}×`;
    b.setAttribute("aria-pressed", s === serving);
    b.onclick = () => { serving = s; if (base) fill(base); renderSheet(); };
    $("servChips").appendChild(b);
  }
  renderSugg();
}
function renderSugg() {
  const q = $("q").value.trim().toLowerCase();
  const ul = $("sugg"); ul.innerHTML = "";
  const h = history();
  const section = (title, items) => {
    if (!items.length) return;
    const s = document.createElement("li"); s.className = "sec"; s.textContent = title; ul.appendChild(s);
    items.forEach(f => {
      const li = document.createElement("li");
      const pick = document.createElement("button"); pick.type = "button"; pick.className = "pick";
      pick.textContent = f.name;
      const sm = document.createElement("small"); sm.className = "num";
      sm.textContent = `${Math.round(f.kcal)} kcal · P ${r1(f.p)} C ${r1(f.c)} F ${r1(f.f)}${f.count ? ` · 吃過 ${f.count} 次` : ""}`;
      pick.appendChild(sm);
      pick.onclick = () => { base = f; $("q").value = f.name; fill(f); };
      const star = document.createElement("button"); star.type = "button"; star.className = "star";
      const on = state.favorites.includes(f.name);
      star.textContent = on ? "★" : "☆"; star.setAttribute("aria-pressed", on);
      star.setAttribute("aria-label", on ? `取消常用 ${f.name}` : `設為常用 ${f.name}`);
      star.onclick = () => {
        state.favorites = on ? state.favorites.filter(n => n !== f.name) : [...state.favorites, f.name];
        save(); renderSugg();
      };
      li.append(pick, star); ul.appendChild(li);
    });
  };
  if (!q) {
    section("常用", frequent());
    if (!frequent().length) section("常見食物", FOODS.slice(0, 10));
  } else {
    const mine = [...h.values()].filter(f => f.name.toLowerCase().includes(q)).sort((a, b) => b.count - a.count);
    const table = FOODS.filter(f => f.name.toLowerCase().includes(q) && !h.has(f.name));
    section("吃過的", mine.slice(0, 8));
    section("常見食物", table.slice(0, 8));
  }
  ul.hidden = !ul.children.length;
}
function fill(f) {
  const m = serving;
  $("fKcal").value = Math.round(f.kcal * m);
  $("fP").value = r1(f.p * m); $("fC").value = r1(f.c * m); $("fF").value = r1(f.f * m);
}

$("q").addEventListener("input", () => { base = null; renderSugg(); });
$("closeSheet").onclick = () => $("sheet").close();
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) $("sheet").close(); });
$("addForm").addEventListener("submit", ev => {
  ev.preventDefault();
  let name = $("q").value.trim();
  if (!name) { toast("先輸入食物名稱"); $("q").focus(); return; }
  if (base && serving !== 1 && name === base.name) name = `${name} ×${serving}`;
  const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), meal: selMeal, name,
    kcal: +$("fKcal").value || 0, p: +$("fP").value || 0, c: +$("fC").value || 0, f: +$("fF").value || 0, at: Date.now() };
  const d = day(current);
  commitDay(current, { ...d, entries: [...d.entries, e] });
  $("sheet").close();
  toast(`已加入「${name}」到${selMeal}`);
});

/* ---------- nav, goals, backup ---------- */
$("prev").onclick = () => { current = shift(current, -1); render(); };
$("next").onclick = () => { if (current < todayKey()) { current = shift(current, 1); render(); } };
$("fab").onclick = () => openSheet();
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => { view = b.dataset.view; render(); window.scrollTo(0, 0); });
for (const [k, id] of [["kcal", "gKcal"], ["p", "gP"], ["c", "gC"], ["f", "gF"]])
  $(id).addEventListener("change", () => { const v = +$(id).value; if (v > 0) { state.goals[k] = v; save(); toast("目標已更新"); } render(); });

$("exportBtn").onclick = async () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
  const file = new File([blob], `餐盤日記備份-${todayKey()}.json`, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: "餐盤日記備份" }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("importFile").addEventListener("change", async () => {
  const f = $("importFile").files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data.days !== "object") throw new Error();
    // 合併：同一天以備份檔為準，其他天保留
    state = { days: { ...state.days, ...data.days }, goals: { ...DEFAULT_GOALS, ...(data.goals || state.goals) },
      favorites: [...new Set([...(state.favorites || []), ...(data.favorites || [])])] };
    save(); render(); toast("已匯入備份");
  } catch { toast("這個檔案不是餐盤日記的備份檔"); }
  $("importFile").value = "";
});

let toastTimer;
function toast(t) { $("toast").textContent = t; $("toast").hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").hidden = true, 2200); }

/* 跨過午夜回到 app 時，自動跳到新的一天 */
let lastToday = todayKey();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && todayKey() !== lastToday) {
    if (current === lastToday) current = todayKey();
    lastToday = todayKey(); render();
  }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
</body>
</html>
